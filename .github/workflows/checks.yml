name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Generated indexes are up to date
        run: python Tools/update_indexes.py --check
      - name: Tool tests
        run: python -m pytest Tools/tests
