name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Generated indexes are up to date
        run: python Tools/update_indexes.py --check
      - name: Tool tests
        run: python -m pytest Tools/tests

  # Build and test on both platforms (Specs/m1-core.md, "Toolchain"). Runner images are named
  # exactly, not -latest, so the toolchain changes only when we change it.
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            preset: windows
            qt-arch: win64_msvc2022_64
          - os: ubuntu-24.04
            preset: linux
            qt-arch: linux_gcc_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages Qt needs, and headless UI tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libegl-dev libxkbcommon0 libfontconfig1
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
      # The builds' tests need TeX (Specs/m2-statements-review.md, "Dependencies and toolchain").
      # Linux only: a TeX Live install is too large for each Windows run, so they skip there.
      # LOOM_REQUIRE_TEX=1 makes a missing latexmk fail them here instead of skipping silently.
      - name: TeX for the build tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
          echo "LOOM_REQUIRE_TEX=1" >> "$GITHUB_ENV"
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          arch: ${{ matrix.qt-arch }}
          cache: true
          # aqtinstall 3.3.0, the action's default, can't install Qt 6.11 on Windows; the fix is
          # on its main branch but not released. Wiki/gotchas/ci/aqtinstall-qt-6-11-windows.md
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" -DLOOM_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config Debug
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -C Debug
